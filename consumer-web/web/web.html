<head>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css"
    >
</head>
<body>
    <header class="container">
      <hgroup>
        <h2>Movies</h2>
      </hgroup>
    </header>
    <main class="container">
        <article id="article">
            <h4>Film: </h4>
            <p id="film">Fetch a file to change this text.</p>
            <h4>Date: </h4>
            <p id="date">Fetch a file to change this text.</p>
        </article>
    </main>
    <script>
        getText('movies.json');
        async function getText(file) {
            await fetch(file).then(async function(response) {
                const movies = await response.json();
                return movies[0];
            }).then(function(json) {
                document.getElementById("film").innerHTML = json.name;
                let dateString = json.date.split('-');
                let date = new Date(dateString[0], (dateString[1] - 1), dateString[2]);
                let year = new Intl.DateTimeFormat('en', { year: 'numeric' }).format(date);
                let month = new Intl.DateTimeFormat('en', { month: 'long' }).format(date);
                let day = new Intl.DateTimeFormat('en', { day: '2-digit' }).format(date);
                document.getElementById("date").innerHTML = `${day} ${month} ${year}`;
            }).catch(function(ex) {
            console.log('Parsing failed:', ex);
            });
        }
    </script>
</body>
